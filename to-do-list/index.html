<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div>
      <header>
        <h1 class="heading">Your To do list</h1>
        <h2 class="date-today"></h2>
        <button class="mode">Change mode</button>
      </header>

      <div class="todo-group">
        <span class="input-todo">
          <label for="text">Add your To-Do</label>
          <input type="text" class="todo" />
        </span>
        <button  class="btn">Add</button>
      </div>

      <div class="all-to-do">
        <h2>Your To Do</h2>
        <div >
           <ul class="todos"></ul>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
