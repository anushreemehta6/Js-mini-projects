<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div>
      <h1>LogIn</h1>
      <form  class="login-form">
        <div class="outer-block">
          <label for="email">Enter valid email</label>
          <input type="email" class="input-email" />
        </div>
        <div class="outer-block">
          <label for="password">Enter correct password</label>
          <input type="password" class="input-password" />
        </div>

        <button type="submit" class="btn">LogIn</button>
      </form>

      <p class="error-mess">
        <strong>Error message will be displayed here!!</strong>
      </p>
    </div>
  </body>
  <script src="index.js"></script>
</html>
